# ==============================================================================
# Enterprise Production GitLab CI/CD Pipeline for VAANI Sovereign DPI Platform
# Dual Deployment Strategy:
#   1. GitLab Pages: Instant static Sovereign Policy Cockpit, Pitch Deck, and API Docs
#   2. Google Cloud Platform (GCP): Multi-region Serverless Cloud Run (asia-south1 / asia-south2)
# ==============================================================================

stages:
  - lint-and-security
  - test
  - build
  - terraform-plan
  - deploy

variables:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  GCP_REGION: "asia-south1"
  GCP_SECONDARY_REGION: "asia-south2"
  ARTIFACT_REGISTRY: "asia-south1-docker.pkg.dev/${GCP_PROJECT_ID}/vaani"

default:
  interruptible: true

# -------------------------------------------------------------
# Stage 1: Code Quality, Linting & AST Security Auditing
# -------------------------------------------------------------
backend:lint-and-security:
  stage: lint-and-security
  image: python:3.11-slim
  before_script:
    - pip install flake8 bandit safety
  script:
    - echo "Running flake8 code style checks..."
    - flake8 backend/app --max-line-length=120 --ignore=E203,W503
    - echo "Running Bandit AST security scanner for OWASP Top 10 vulnerabilities..."
    - bandit -r backend/app -ll
    - echo "Auditing Python dependencies for CVEs..."
    - safety check -r backend/requirements.txt || true

frontend:lint-and-typecheck:
  stage: lint-and-security
  image: node:20-alpine
  before_script:
    - cd frontend && npm ci --legacy-peer-deps
  script:
    - echo "Verifying TypeScript strict type safety..."
    - npx tsc --noEmit

secret-detection:
  stage: lint-and-security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - echo "Scanning codebase to enforce zero plaintext secrets (DPDP Act & CIS compliance)..."
    - gitleaks detect --verbose --redact

# -------------------------------------------------------------
# Stage 2: Automated Unit, Integration & Regression Testing
# -------------------------------------------------------------
backend:unit-tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libsndfile1 ffmpeg
    - pip install -r backend/requirements.txt
  script:
    - echo "Executing pytest suite across all omnichannel webhooks & GCP services..."
    - python -m pytest tests/ -v --cov=backend/app --cov-report=term-missing --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# -------------------------------------------------------------
# Stage 3: Container Build & Google Artifact Registry Push
# -------------------------------------------------------------
build:gateway-container:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://${GCP_REGION}-docker.pkg.dev\":{\"auth\":\"$(echo -n _json_key:${GCP_SERVICE_ACCOUNT_KEY} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/backend"
        --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
        --destination "${ARTIFACT_REGISTRY}/gateway:${CI_COMMIT_SHA}"
        --destination "${ARTIFACT_REGISTRY}/gateway:latest"
        --cache=true
  rules:
    - if: '$GCP_SERVICE_ACCOUNT_KEY != null && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG != null)'
      allow_failure: true
    - when: manual
      allow_failure: true

build:frontend-nextjs:
  stage: build
  image: node:20-alpine
  before_script:
    - cd frontend && npm ci --legacy-peer-deps
  script:
    - echo "Building production Next.js 14 App Router bundle..."
    - npm run build
  artifacts:
    paths:
      - frontend/.next
    expire_in: 1 week

# -------------------------------------------------------------
# Stage 4: Terraform Infrastructure as Code Validation
# -------------------------------------------------------------
terraform:validate-and-plan:
  stage: terraform-plan
  image: hashicorp/terraform:1.7.0
  before_script:
    - cd terraform
    - terraform init -backend=false
  script:
    - terraform validate
    - echo "Terraform syntax and resource graph validated successfully."

# -------------------------------------------------------------
# Stage 5A: GitLab Pages Deployment (Static Cockpit & Docs)
# -------------------------------------------------------------
pages:
  stage: deploy
  image: alpine:latest
  before_script: []
  script:
    - mkdir -p public
    - cp -r dashboard/* public/
    - cp -r results/*.png public/ 2>/dev/null || true
    - mkdir -p public/docs
    - cp -r docs/* public/docs/ 2>/dev/null || true
    - echo "VAANI Sovereign Policy Cockpit & Documentation published to GitLab Pages."
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: on_success

# -------------------------------------------------------------
# Stage 5B: Zero-Downtime Deployment to Google Cloud Run
# -------------------------------------------------------------
deploy:cloud-run-staging:
  stage: deploy
  image: google/cloud-sdk:slim
  script:
    - echo "${GCP_SERVICE_ACCOUNT_KEY}" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project "${GCP_PROJECT_ID}"
    - gcloud run deploy vaani-api-gateway-staging
        --image "${ARTIFACT_REGISTRY}/gateway:${CI_COMMIT_SHA}"
        --region "${GCP_REGION}"
        --platform managed
        --allow-unauthenticated
        --concurrency 80
        --min-instances 0
        --max-instances 10
  environment:
    name: staging
    url: https://vaani-staging.gov.in
  rules:
    - if: '$GCP_SERVICE_ACCOUNT_KEY != null && $CI_COMMIT_BRANCH == "develop"'
    - when: manual
      allow_failure: true

deploy:cloud-run-production:
  stage: deploy
  image: google/cloud-sdk:slim
  script:
    - echo "${GCP_SERVICE_ACCOUNT_KEY}" | gcloud auth activate-service-account --key-file=-
    - gcloud config set project "${GCP_PROJECT_ID}"
    - echo "Deploying primary production gateway to asia-south1 (Mumbai)..."
    - gcloud run deploy vaani-api-gateway-mumbai
        --image "${ARTIFACT_REGISTRY}/gateway:${CI_COMMIT_SHA}"
        --region "${GCP_REGION}"
        --platform managed
        --concurrency 80
        --min-instances 2
        --max-instances 100
    - echo "Deploying secondary failover gateway to asia-south2 (Delhi)..."
    - gcloud run deploy vaani-api-gateway-delhi
        --image "${ARTIFACT_REGISTRY}/gateway:${CI_COMMIT_SHA}"
        --region "${GCP_SECONDARY_REGION}"
        --platform managed
        --concurrency 80
        --min-instances 1
        --max-instances 50
  environment:
    name: production
    url: https://vaani.gov.in
  rules:
    - if: '$GCP_SERVICE_ACCOUNT_KEY != null && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'
      when: manual
    - when: manual
      allow_failure: true
